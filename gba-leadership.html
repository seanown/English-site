<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GBA E-Commerce Association — Leadership</title>
<meta name="description" content="The eighteen leaders connecting Macau, Hong Kong, and the Greater Bay Area through commerce, culture, and AI." />
<link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#003262;
    --gold:#FDB515;
    --ink:#0a0a0a;
    --paper:#fafaf7;
    --rule:#1a1a1a;
    --muted:#5b5b5b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%;height:auto}

  /* top bar (matches the rest of the site) */
  .top{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold)}
  .top-inner{max-width:1180px;margin:0 auto;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .brand{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:.12em;color:#fff}
  .brand b{color:var(--gold)}
  nav.main{display:flex;align-items:center;gap:28px;font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
  nav.main a{padding:6px 0;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
  nav.main a:hover{color:var(--gold);border-bottom-color:var(--gold)}
  nav.main a.cta{background:var(--gold);color:var(--navy);padding:12px 22px;letter-spacing:.16em}
  nav.main a.cta:hover{background:#fff;color:var(--navy);border-bottom-color:transparent}

  /* hero band */
  .hero{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold);padding:64px 32px 72px}
  .hero-inner{max-width:1180px;margin:0 auto}
  .hero h1{font-family:'Bebas Neue',sans-serif;font-size:64px;letter-spacing:.06em;line-height:1;text-transform:uppercase;color:#fff}
  .hero p{margin-top:14px;font-family:'Oswald',sans-serif;font-weight:500;font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}

  /* content */
  main{max-width:1180px;margin:0 auto;padding:56px 32px 96px}
  .lede{font-size:18px;color:var(--ink);max-width:760px;margin-bottom:40px}

  /* the grid — fully static, no JS, no controls */
  .people{display:grid;grid-template-columns:repeat(3,1fr);gap:36px 28px}
  @media (max-width:880px){.people{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:520px){.people{grid-template-columns:1fr}}

  .person{background:#fff;border:1px solid #ececec}
  .person .frame{aspect-ratio:1/1;overflow:hidden;background:#eaeaea}
  .person .frame img{width:100%;height:100%;object-fit:cover;object-position:center top;transition:transform .35s ease}
  .person:hover .frame img{transform:scale(1.03)}
  .person .name{display:block;padding:14px 16px 16px;font-family:'Oswald',sans-serif;font-weight:600;font-size:16px;letter-spacing:.10em;text-transform:uppercase;color:var(--ink);text-align:center;border-top:2px solid var(--gold)}
</style>
</head>
<body>

<div class="top">
  <div class="top-inner">
    <a href="index.html" class="brand">SEAN<b>OWN</b></a>
    <nav class="main">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="news.html">News</a>
      <a href="portfolio.html">Work</a>
      <a href="speaking.html">Speaking</a>

      <a href="contact.html" class="cta">Subscribe</a>

</div>

  </section>
