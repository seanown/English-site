<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Berkeley Blue background -->
  <rect width="128" height="128" fill="#003262"/>
  <!-- White document outline -->
  <rect x="34" y="22" width="60" height="84" fill="#FFFFFF" rx="2"/>
  <!-- Folded corner -->
  <polygon points="84,22 94,22 94,32" fill="#E0E0E0"/>
  <!-- Three text lines -->
  <rect x="42" y="42" width="44" height="3" fill="#003262"/>
  <rect x="42" y="50" width="36" height="3" fill="#003262"/>
  <rect x="42" y="58" width="40" height="3" fill="#003262"/>
  <!-- Orange PPT pill -->
  <rect x="34" y="78" width="60" height="20" fill="#ED7D31"/>
  <!-- PPT text -->
  <text x="64" y="93" font-family="Bebas Neue, Arial Narrow, Impact, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">PPT</text>
</svg>
